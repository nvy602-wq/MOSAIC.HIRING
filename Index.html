<body>
  <header id="header" class="site-header"></header>
  <main id="app" class="page"><div class="loading"><i class="loader"></i> Đang tải dữ liệu tuyển dụng…</div></main>
  <footer id="footer" class="site-footer"></footer>
  <div id="modal-root"></div><div id="toast-root" class="toast-wrap"></div><div id="submit-lock" class="submit-lock hidden" aria-live="polite" aria-busy="false"><div class="submit-lock-card"><i class="loader"></i><span id="submit-lock-message">Đang tải hồ sơ lên hệ thống…</span></div></div>

  <script>
    'use strict';
    const S = {settings:null, jobs:null, reviews:[], reviewsLoaded:false, filters:{keyword:'',industry:'',location:'',level:'',employmentType:'',salary:'',page:1,pageSize:9}, candidate:null, admin:null, hrEligible:false, hrEligibleEmail:'', savedJobIds:new Set(), publicCache:new Map(), publicPending:{}, publicRequestId:0, publicView:'jobs', adminView:'dashboard', dashboard:null, dashboardFilter:{mode:'all',dateFrom:'',dateTo:''}, visitorKey:'', rating:5};
    // Compatibility alias for an earlier submit handler. It always resolves to
    // the live HR token and prevents a missing-token error when creating jobs.
    Object.defineProperty(S,'admintoken',{get:()=>S.admin&&S.admin.token});
    const rootNode = root => typeof root==='string'?document.querySelector(root):(root||document);
    const $ = (selector, root=document) => rootNode(root).querySelector(selector);
    const $$ = (selector, root=document) => Array.from(rootNode(root).querySelectorAll(selector));
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const nl = value => esc(value || 'Chưa cập nhật.').replace(/\n/g,'<br>');
    const date = value => { if(!value) return 'Chưa cập nhật'; const d=new Date(value); return Number.isNaN(d.getTime()) ? esc(value) : new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d); };
    const dateTime = value => { if(!value) return 'Chưa cập nhật'; const d=new Date(value); return Number.isNaN(d.getTime()) ? esc(value) : new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d); };
    const short = (value,n=115) => String(value||'').length>n ? esc(String(value).slice(0,n))+'…' : esc(value||'');
    const vnd = value => {const raw=String(value||'').trim();if(!raw)return 'Thỏa thuận';if(/thỏa\s*thuận|negotiable|usd|\$|dollar/i.test(raw))return raw;const scale=/triệu|trieu/i.test(raw)?1e6:/tỷ|ty/i.test(raw)?1e9:1;const parts=raw.match(/\d[\d.,\s]*/g);if(!parts||!parts.length||parts.length>2)return raw;const numbers=parts.map(part=>{const parsed=Number(part.replace(/\D/g,''));return scale>1&&parsed<scale?parsed*scale:parsed});if(numbers.some(n=>!Number.isFinite(n)||n<=0))return raw;return numbers.map(n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(n)).join(numbers.length>1?' – ':'')+' VNĐ'};
    const safeUrl=value=>{const raw=String(value||'').trim();if(!raw)return '';try{const url=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw);return /^https?:$/.test(url.protocol)?url.href:''}catch(error){return ''}};
    const socialIcon=kind=>({facebook:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.7 21v-8h2.7l.4-3.1h-3.1V7.95c0-.9.25-1.52 1.58-1.52h1.69V3.65c-.29-.04-1.28-.12-2.44-.12-2.42 0-4.08 1.48-4.08 4.2V9.9H7.7V13h2.75v8h3.25z"/></svg>',instagram:'<svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r=".8" fill="currentColor" stroke="none"/></svg>',tiktok:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 3c.36 2.24 1.64 3.58 3.8 4.02v3.03c-1.39.05-2.67-.44-3.8-1.34v6.39c0 3.21-2.46 5.46-5.57 5.46-3.36 0-5.84-3.25-5.1-6.52.58-2.57 3-4.27 5.67-3.92v3.14c-.31-.1-.67-.12-1.02-.05-1.9.37-2.46 2.73-1.05 3.87 1.52 1.22 3.93.13 3.93-1.84V3h3.14z"/></svg>',website:'<svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.25 2.45 3.37 5.45 3.37 9S14.25 18.55 12 21c-2.25-2.45-3.37-5.45-3.37-9S9.75 5.45 12 3z"/></svg>',threads:'<svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.9 10.1c-.3-3.2-2.3-5-5.6-5-3.6 0-6 2.2-6 6.2 0 4.3 2.3 7.2 6.1 7.2 3 0 5-1.7 5-4.2 0-2.3-1.8-3.8-4.6-3.8-2.4 0-4.2 1.2-4.2 3.3 0 1.7 1.3 2.8 3.3 2.8 2.8 0 4.8-1.7 5.6-4.9"/></svg>',group:'<svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9.5" r="2.3"/><path d="M3.5 19c.45-3.15 2.35-4.8 5.5-4.8s5.05 1.65 5.5 4.8M15 14.8c2.75.15 4.35 1.55 4.8 4.2"/></svg>'})[kind]||'';
    const socialLink=(label,url,kind)=>{const href=safeUrl(url);const icon=kind==='threads'?'<span class="threads-glyph">@</span>':socialIcon(kind);return href?`<a class="social-link social-${esc(kind)}" href="${esc(href)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(label)}" title="${esc(label)}">${icon}</a>`:''};
    const debounce = (fn,wait=300) => {let id; return (...args)=>{clearTimeout(id);id=setTimeout(()=>fn(...args),wait)}};
    function api(name,...args){return new Promise((resolve,reject)=>{
      // Index.html is not a standalone website. When opened with file:// it
      // has no Apps Script bridge and previously appeared to spin forever.
      if(typeof google==='undefined'||!google.script||!google.script.run){
        reject(new Error('Hãy mở ứng dụng bằng URL Web app của Google Apps Script, không mở trực tiếp tệp Index.html trên máy.'));
        return;
      }
      let finished=false;
      const complete=(handler,value)=>{if(finished)return;finished=true;clearTimeout(timer);handler(value)};
      // A cold Apps Script execution or an unavailable spreadsheet must show a
      // recoverable error instead of leaving the loading screen indefinitely.
      const timer=setTimeout(()=>complete(reject,new Error('Máy chủ đang phản hồi chậm. Vui lòng thử lại sau vài giây.')),30000);
      try{
        google.script.run
          .withSuccessHandler(value=>complete(resolve,value))
          .withFailureHandler(error=>complete(reject,new Error(error&&error.message?error.message:String(error))))[name](...args);
      }catch(error){complete(reject,error)}
    })}
    function toast(message,type=''){const item=document.createElement('div');item.className='toast '+type;item.textContent=message;$('#toast-root').append(item);setTimeout(()=>item.remove(),4200)}
    function setLoading(message='Đang tải dữ liệu…'){$('#app').innerHTML=`<div class="loading"><i class="loader"></i>${esc(message)}</div>`}
    function clientRequestId(){return (window.crypto&&window.crypto.randomUUID?window.crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,100)}
    function setSubmitBusy(form,busy,message='Đang tải hồ sơ lên hệ thống…'){
      if(form) form.setAttribute('aria-busy',busy?'true':'false');
      const lock=$('#submit-lock');
      if(lock){lock.classList.toggle('hidden',!busy);lock.setAttribute('aria-busy',busy?'true':'false');const label=$('#submit-lock-message');if(label)label.textContent=message}
      if(form){$$('input,select,textarea,button',form).forEach(control=>{control.disabled=busy||control.dataset.wasDisabled==='true'});const button=$('button[type="submit"]',form);if(button){if(busy){button.dataset.originalText=button.textContent;button.textContent='Đang gửi…'}else if(button.dataset.originalText){button.textContent=button.dataset.originalText;delete button.dataset.originalText}}}
    }
    function token(type){return sessionStorage.getItem('momau_'+type+'_token')||''}
    function candidateTrust(email){try{return localStorage.getItem('momau_candidate_trust_'+encodeURIComponent(String(email||'').toLowerCase()))||''}catch(error){return ''}}
    function rememberCandidateTrust(email,value){try{if(value)localStorage.setItem('momau_candidate_trust_'+encodeURIComponent(String(email||'').toLowerCase()),value)}catch(error){}}
    function saveSession(type,data){sessionStorage.setItem('momau_'+type+'_token',data.token);S[type]=data}
    function clearSession(type){sessionStorage.removeItem('momau_'+type+'_token');S[type]=null}
    function setSavedJobIds(ids){S.savedJobIds=new Set((ids||[]).map(id=>String(id)));syncSavedJobButtons()}
    function isSavedJob(id){return S.savedJobIds.has(String(id))}
    function syncSavedJobButtons(){document.querySelectorAll('[data-action="save-job"]').forEach(button=>{const saved=isSavedJob(button.dataset.id);button.classList.toggle('is-saved',saved);button.setAttribute('aria-pressed',saved?'true':'false');if(button.classList.contains('job-bookmark'))button.textContent=saved?'♥':'♡';else if(saved)button.textContent='♥ Đã lưu công việc'})}
    function visitorKey(){let key=sessionStorage.getItem('momau_visitor');if(!key){key=(window.crypto&&window.crypto.randomUUID?window.crypto.randomUUID():Date.now()+'-'+Math.random()).replace(/[^\w-]/g,'');sessionStorage.setItem('momau_visitor',key)}return key}

    async function init(){
      S.visitorKey=visitorKey();
      const restores=[loadPublic()];
      const ct=token('candidate');if(ct)restores.push(api('getCandidateProfile',ct).then(p=>{S.candidate={token:ct,email:p.Email,role:'Candidate',profile:p};S.hrEligible=Boolean(p.HrPortalEligible);S.hrEligibleEmail=S.hrEligible?p.Email:'';setSavedJobIds(p.SavedJobIDs)}).catch(()=>{clearSession('candidate');S.hrEligible=false;S.hrEligibleEmail=''}));
      const at=token('admin');if(at)restores.push(api('getDashboardStats',S.dashboardFilter,at).then(d=>{S.admin={token:at};S.dashboard=d}).catch(()=>clearSession('admin')));
      const results=await Promise.allSettled(restores);
      const publicResult=results[0];if(publicResult.status==='rejected'){$('#app').innerHTML=errorState(publicResult.reason&&publicResult.reason.message,'load-public');return}
      renderHeader();if(!$('#footer').innerHTML)renderFooter();
      if(window.location.hash==='#hr'){
        if(S.admin){S.publicView='admin';renderHeader();await renderAdmin()}
        else if(S.hrEligible){adminLogin()}
        else { window.history.replaceState(null,'',window.location.pathname+window.location.search); toast('Hãy đăng nhập bằng email nội bộ được cấp quyền để mở Cổng HR.','error'); }
      }
    }
    function publicCacheKey(){return JSON.stringify(S.filters)}
    function applyPublicBootstrap(bootstrap){const oldSettings=JSON.stringify(S.settings||{});S.settings=bootstrap.settings||S.settings;S.jobs=bootstrap.data||S.jobs;if(bootstrap.reviews){S.reviews=bootstrap.reviews;S.reviewsLoaded=true}if(oldSettings!==JSON.stringify(S.settings)||!$('#header').innerHTML)renderHeader();if(oldSettings!==JSON.stringify(S.settings)||!$('#footer').innerHTML)renderFooter();renderJobs()}
    async function loadPublic(){const key=publicCacheKey(),firstLoad=!S.jobs,cached=S.publicCache.get(key);if(cached&&Date.now()-cached.createdAt<60000){S.publicRequestId++;applyPublicBootstrap(cached.payload);return cached.payload}if(S.publicPending[key])return S.publicPending[key].then(bootstrap=>{if(key===publicCacheKey())applyPublicBootstrap(bootstrap);return bootstrap});if(firstLoad)setLoading();const requestId=++S.publicRequestId;const request=api('getPublicBootstrap',S.filters).then(bootstrap=>{S.publicCache.set(key,{createdAt:Date.now(),payload:bootstrap});if(S.publicCache.size>12)S.publicCache.delete(S.publicCache.keys().next().value);if(requestId===S.publicRequestId)applyPublicBootstrap(bootstrap);return bootstrap});S.publicPending[key]=request;try{return await request}finally{delete S.publicPending[key]}}
    async function ensureReviewsLoaded(){if(S.reviewsLoaded)return S.reviews;S.reviews=await api('getReviews');S.reviewsLoaded=true;return S.reviews}
    function renderHeader(){const s=S.settings||{},wordmark=safeUrl(s.WordmarkImageUrl||s.LogoUrl);$('#header').innerHTML=`<div class="header-inner"><button class="brand" data-action="go-jobs" aria-label="Trang chủ"><img class="brand-logo" data-brand-image src="${esc(wordmark)}" alt="Logo ${esc(s.CompanyName||'Mớ Màu')}"><span class="brand-copy brand-fallback"><span class="brand-name">Mớ Màu</span></span></button><nav class="main-nav"><button class="nav-link ${S.admin?'':'active'}" data-action="go-jobs">Việc làm</button><button class="nav-link" data-action="candidate-home">Hồ sơ của tôi</button><button class="nav-link" data-action="go-reviews">Đánh giá cộng đồng</button><button class="nav-link nav-hr" data-action="admin-home">Cổng nội bộ HR</button></nav><div class="header-actions">${S.candidate?`<span class="header-user">${esc(S.candidate.email)}</span><button class="btn btn-outline btn-small" data-action="candidate-home">Hồ sơ</button><button class="icon-btn" title="Đăng xuất" data-action="candidate-logout">↪</button>`:`<button class="btn btn-outline btn-small" data-action="candidate-login">Đăng nhập hồ sơ</button><button class="btn btn-primary btn-small" data-action="candidate-login">Tạo / cập nhật hồ sơ</button>`}</div></div>`;wireBrandFallbacks()}
    function renderFooter(){const s=S.settings||{},wordmark=safeUrl(s.FooterWordmarkImageUrl||s.WordmarkImageUrl||s.LogoUrl);const website=safeUrl(s.Website);const socials=[socialLink('Facebook',s.Facebook,'facebook'),socialLink('Instagram',s.Instagram,'instagram'),socialLink('TikTok',s.TikTok,'tiktok'),socialLink('Threads',s.Threads,'threads'),socialLink('Group Face',s.GroupFace,'group'),socialLink('Website',s.Website,'website')].join('');$('#footer').innerHTML=`<div class="footer-inner"><div class="footer-grid"><section><div class="footer-brand"><img data-brand-image src="${esc(wordmark)}" alt="Logo ${esc(s.CompanyName||'Mớ Màu')}"><strong class="brand-fallback">Mớ Màu</strong></div><p>${esc(s.BrandDescription||'')}</p>${socials?`<div class="footer-social">${socials}</div>`:''}</section><section><h3>THÔNG TIN LIÊN HỆ</h3><ul><li>✉ ${esc(s.HrEmail||'')}</li><li>☎ ${esc(s.Phone||'')}</li><li>▦ ${esc(s.Address||'')}</li>${website?`<li>◎ <a href="${esc(website)}" target="_blank" rel="noopener noreferrer">${esc(s.Website)}</a></li>`:''}</ul></section><section><h3>DÀNH CHO ỨNG VIÊN</h3><ul><li><button class="nav-link" data-action="go-jobs">Danh sách việc làm mới</button></li><li><button class="nav-link" data-action="go-reviews">Đánh giá từ cộng đồng</button></li><li><button class="nav-link" data-action="candidate-home">Hồ sơ và trạng thái ứng tuyển</button></li></ul></section></div><div class="footer-bottom"><span>${esc(s.FooterCopyright||'')}</span><span>Hệ thống tuyển dụng tích hợp Google Apps Script &amp; Drive</span></div></div>`;wireBrandFallbacks()}

    function jobPagination(d){if((d.totalPages||1)<=1)return '';const page=Number(d.page)||1,total=Number(d.totalPages)||1;const pages=Array.from({length:total},(_,i)=>i+1).filter(n=>n===1||n===total||Math.abs(n-page)<=1);let previous=0;const buttons=pages.map(n=>{const gap=n-previous>1?'<span class="pagination-note">…</span>':'';previous=n;return `${gap}<button class="${n===page?'active':''}" data-action="public-page" data-page="${n}" ${n===page?'aria-current="page"':''}>${n}</button>`}).join('');return `<nav class="pagination" aria-label="Phân trang việc làm"><button data-action="public-page" data-page="${page-1}" ${page===1?'disabled':''}>←</button>${buttons}<button data-action="public-page" data-page="${page+1}" ${page===total?'disabled':''}>→</button></nav>`}

    function isCtvJobClient(job){const industry=String(job&&job.Industry||'');return /(?:^|\s)ctv(?:\s|$)/i.test(industry)||/cộng\s*tác\s*viên/i.test(industry)||/cong\s*tac\s*vien/i.test(industry)}
    function selectedCtvDate(jobId){const input=Array.from(document.querySelectorAll('[data-event-date-job]')).find(el=>el.dataset.eventDateJob===String(jobId));return input&&input.value||''}
    function parseScreeningOptions(value){return String(value||'').split(/\r?\n/).map(line=>line.trim().replace(/^[A-D]\s*[|.:-]\s*/i,'')).filter(Boolean).slice(0,4)}
    function jobScreeningQuestions(job){return [1,2,3].map(number=>{const text=String((job||{})['ScreeningQuestion'+number]||'').trim();const requestedType=String((job||{})['ScreeningQuestion'+number+'Type']||'').toUpperCase();const options=parseScreeningOptions((job||{})['ScreeningQuestion'+number+'Options']);return {number,text,type:requestedType==='CHOICE'&&options.length>=2?'CHOICE':'TEXT',options}}).filter(item=>item.text)}
    function screeningQuestionFields(job){const questions=jobScreeningQuestions(job);if(!questions.length)return '';return `<section class="screening-form"><div class="screening-form-heading"><span>Thông tin bổ sung</span><p>Nhà tuyển dụng yêu cầu các câu trả lời dưới đây để xem xét hồ sơ.</p></div>${questions.map(item=>{const control=item.type==='CHOICE'?`<div class="screening-choice-list" data-screening-choice-group="${item.number}"><p class="screening-choice-note">Có thể chọn một hoặc nhiều đáp án phù hợp.</p>${item.options.map((option,index)=>`<label class="screening-choice"><input type="checkbox" data-screening-answer="${item.number}" value="${esc(option)}"><span class="screening-choice-code">${String.fromCharCode(65+index)}</span><span>${esc(option)}</span></label>`).join('')}</div>`:`<textarea name="screeningAnswer${item.number}" required maxlength="2500" placeholder="Nhập câu trả lời của bạn…"></textarea>`;return `<div class="field"><label>${esc(item.text)} *</label>${control}</div>`}).join('')}</section>`}
    function applicationForm(job,eventDate){const p=S.candidate&&S.candidate.profile||{};const eventField=isCtvJobClient(job)?`<div class="field"><label>Ngày tham gia sự kiện *</label><input name="eventDate" type="date" required value="${esc(eventDate||'')}"></div>`:'';return `<h2>Nộp hồ sơ ứng tuyển</h2><p class="notice">${esc(job.Title)} · ${esc(job.JobID)}. CV được lưu bảo mật trong Google Drive, chỉ HR được phân quyền mới có thể mở.</p><form id="application-form" data-job="${esc(job.JobID)}" data-submission-key="${clientRequestId()}"><div class="form-grid" style="margin-top:18px"><div class="field"><label>Họ và tên *</label><input name="fullName" required value="${esc(p.FullName||'')}"></div><div class="field"><label>Email *</label><input name="email" type="email" required value="${esc(p.Email||S.candidate&&S.candidate.email||'')}"></div><div class="field"><label>Số điện thoại *</label><input name="phone" required value="${esc(p.Phone||'')}"></div><div class="field"><label>Khu vực làm việc</label><input name="location" value="${esc(p.Location||'')}" placeholder="Hồ Chí Minh"></div>${eventField}</div><div class="field" style="margin-top:15px"><label>CV PDF / DOC / DOCX * (tối đa 10MB)</label><input name="file" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required></div>${screeningQuestionFields(job)}<div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Hủy</button><button class="btn btn-primary" type="submit">Gửi hồ sơ ngay</button></div></form>`}
    async function openApplication(id){try{const job=await api('getJob',id,S.admin&&S.admin.token);showModal(applicationForm(job,selectedCtvDate(id)),true)}catch(error){showError(error)}}
    function fileAsBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(new Error('Không thể đọc tệp CV.'));reader.readAsDataURL(file)})}
    async function submitApplication(form){
      if(form.dataset.submitting==='true')return;
      const file=form.file.files[0];
      if(!file)throw new Error('Vui lòng chọn CV.');
      if(file.size>10*1024*1024)throw new Error('CV phải nhỏ hơn 10MB.');
      form.dataset.submitting='true';
      try{
        const data=Object.fromEntries(new FormData(form).entries());
        collectScreeningChoiceAnswers(form,data);
        delete data.file;
        data.jobId=form.dataset.job;
        data.clientRequestId=form.dataset.submissionKey||clientRequestId();
        form.dataset.submissionKey=data.clientRequestId;
        setSubmitBusy(form,true,'Đang lưu hồ sơ và CV bảo mật…');
        data.file={name:file.name,base64:await fileAsBase64(file)};
        const result=await api('createApplication',data,token('candidate'));
        closeModal();
        toast(result.duplicate?'Hồ sơ này đã được tiếp nhận trước đó.':`Ứng tuyển thành công. Mã hồ sơ: ${result.appId}`,'success');
        if(result.storageWarning)toast(result.storageWarning,'error');
        /* Email is sent by the one-minute worker. Do not start a competing queue flush from every visitor. */
      }finally{
        form.dataset.submitting='false';
        setSubmitBusy(form,false);
      }
    }
    function collectScreeningChoiceAnswers(form,data){
      for(let number=1;number<=3;number++){
        const choices=Array.from(form.querySelectorAll(`[data-screening-answer="${number}"]`));
        if(!choices.length)continue;
        const selected=choices.filter(choice=>choice.checked).map(choice=>String(choice.value||'').trim()).filter(Boolean);
        if(!selected.length)throw new Error(`Vui lòng chọn ít nhất một đáp án cho câu hỏi ${number}.`);
        // Only option content is persisted, never the visual A–D labels.
        data[`screeningAnswer${number}`]=selected.join('\n');
      }
      return data;
    }

creening-export-to" type="date" value="${esc(filters.exportDateTo||'')}"></div><div class="screening-filter-actions"><button class="btn btn-outline btn-small" data-action="check-screening-drive">Kiểm tra Drive</button><button class="btn btn-outline btn-small" data-action="filter-screening">Lọc dữ liệu</button><button class="btn btn-primary btn-small" data-action="export-screening-sheet">Xuất Google Sheet</button><button class="btn btn-dark btn-small" data-action="export-screening-pdf">Xuất PDF</button></div></div></section><p class="screening-export-note">${Number(d.total)||0} hồ sơ có câu trả lời · Bảng hiển thị số lần xuất và ba lần xuất gần nhất để tránh trùng. Báo cáo tổng hợp dữ liệu và cho phép HR mở CV trực tiếp bằng liên kết trong Sheet.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Ứng viên</th><th>Vị trí</th><th>Doanh nghiệp</th><th>Ngày nộp</th><th>Câu trả lời</th><th>Lịch sử xuất CV</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${screeningPagination(d)}`;

    function saveBase64Download(payload){const raw=atob(String(payload.base64||''));const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const blob=new Blob([bytes],{type:payload.mimeType||'application/octet-stream'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=payload.name||'bao-cao';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

    async function exportScreeningReport(format,button){
      const filters=screeningFiltersFromPage();
      const initialLabel=format==='PDF'?'Xuất PDF':'Xuất Google Sheet';
      if(button){button.disabled=true;button.textContent='Khởi tạo báo cáo…'}
      try{
        // The report is intentionally built in short requests.  A single
        // request that formats hundreds of rows and inserts every watermark
        // is prone to Apps Script's "server responded slowly" timeout.
        const started=await api('beginScreeningReportExport',filters,S.admin.token);
        const total=Math.max(0,Number(started.total)||0);
        let offset=0;
        while(offset<total){
          if(button)button.textContent=`Đang tạo ${Math.min(offset,total)}/${total}…`;
          const part=await api('appendScreeningReportExport',started.exportId,offset,started.batchSize,S.admin.token);
          const next=Math.max(0,Number(part&&part.nextOffset)||0);
          if(next<=offset)throw new Error('Không thể tiếp tục xuất báo cáo. Vui lòng thử lại.');
          offset=next;
          // Let the browser paint progress between RPC calls; this keeps the
          // HR portal interactive even with a report containing many CVs.
          await new Promise(resolve=>setTimeout(resolve,0));
        }
        if(button)button.textContent='Hoàn tất dữ liệu…';
        const result=await api('finishScreeningReportExport',started.exportId,format,S.admin.token);
        const count=Number(result&&result.count)||total;
        const openAction=result&&result.url?`<a class="btn btn-primary" href="${esc(result.url)}" target="_blank" rel="noopener">Mở Google Sheet</a>`:'';
        // Google Sheet is the canonical report.  Keeping one live report with
        // Drive CV links avoids generating base64 Excel files or individual
        // CV downloads, both of which previously caused long responses.
        const pdfAction=format==='PDF'&&result&&result.fileId?`<button class="btn btn-outline" data-action="download-screening-report" data-id="${esc(result.fileId)}" data-format="PDF">Tải PDF báo cáo</button>`:'';
        const note=format==='SHEET'
          ?'Báo cáo đã được tạo trong Google Sheets; mỗi CV có liên kết Drive trực tiếp để HR được cấp quyền có thể xem tại chỗ.'
          :'Báo cáo Sheet đã sẵn sàng. Bạn có thể mở Sheet hoặc tải bản PDF khi cần.';
        showModal(`<h2>Đã tạo báo cáo</h2><p class="notice">${count} hồ sơ đã được tổng hợp theo bộ lọc hiện tại. ${note}</p><div class="form-actions"><button class="btn btn-outline" data-action="close-modal">Đóng</button>${openAction}${pdfAction}</div>`);
        toast('Đã tạo báo cáo '+(format==='PDF'?'PDF':'Google Sheet')+'.','success');
      }catch(error){showError(error)}finally{if(button){button.disabled=false;button.textContent=initialLabel}}
    }

    function pageNumberButtons(action,jobId,total,page){
      const pages=[];
      for(let n=1;n<=total;n++)if(total<=10||n===1||n===total||Math.abs(n-page)<=2)pages.push(n);
      let previous=0;
      return pages.map(function(n){const gap=previous&&n-previous>1?'<span class="pagination-ellipsis">…</span>':'';previous=n;return gap+'<button data-action="'+action+'" data-id="'+esc(jobId)+'" data-page="'+n+'" '+(n===page?'aria-current="page"':'')+'>'+n+'</button>';}).join('');
    }
    function cvPagination(jobId,d){const total=Number(d.totalPages)||1,page=Number(d.page)||1;if(total<=1)return '';return '<nav class="pagination" aria-label="Phân trang hồ sơ"><button data-action="application-page" data-id="'+esc(jobId)+'" data-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>←</button>'+pageNumberButtons('application-page',jobId,total,page)+'<button data-action="application-page" data-id="'+esc(jobId)+'" data-page="'+(page+1)+'" '+(page===total?'disabled':'')+'>→</button><span class="pagination-note">Trang '+page+'/'+total+' · '+d.total+' CV</span></nav>'}

    function renderHeader(){

    function renderFooter(){

      const socials=[socialLink('Facebook',s.Facebook,'facebook'),socialLink('Instagram',s.Instagram,'instagram'),socialLink('TikTok',s.TikTok,'tiktok'),socialLink('Threads',s.Threads,'threads'),socialLink('Group Face',s.GroupFace,'group')].join('');

    document.addEventListener('click',async event=>{
      const element=event.target&&event.target.closest?event.target.closest('[data-action]'):null;
      if(!element)return;
      const action=element.dataset.action;
      if(!['go-jobs','candidate-home','go-reviews','admin-home','save-job','remove-saved'].includes(action))return;
      event.preventDefault();
      event.stopImmediatePropagation();
      try{
        if(action==='save-job'){
          if(!S.candidate){candidateLogin();toast('Hãy đăng nhập để lưu công việc.');return}
          const result=await api('saveJob',S.candidate.email,element.dataset.id,S.candidate.token);
          setSavedJobIds(result.savedJobIds);syncSavedJobButtons();toast('Đã lưu công việc.','success');
        }else if(action==='remove-saved'){
          if(!S.candidate)return;
          const result=await api('removeSavedJob',S.candidate.email,element.dataset.id,S.candidate.token);
          setSavedJobIds(result.savedJobIds);await renderCandidate();toast('Đã bỏ lưu công việc.');
        }else if(action==='go-jobs'){
          window.history.replaceState(null,'',window.location.pathname+window.location.search);
          S.publicView='jobs';S.adminView='dashboard';renderHeader();renderFooter();await loadPublic();
        }else if(action==='candidate-home'){
          window.history.replaceState(null,'',window.location.pathname+window.location.search);
          S.publicView='candidate';renderHeader();await renderCandidate();
        }else if(action==='go-reviews'){
          window.history.replaceState(null,'',window.location.pathname+window.location.search);
          S.publicView='reviews';renderHeader();renderFooter();await ensureReviewsLoaded();renderReviews();
        }else{
          if(!S.admin&&!S.hrEligible){
            toast('Cổng HR chỉ dành cho bốn email nội bộ đã được cấp quyền.','error');
            return;
          }
          window.history.replaceState(null,'',window.location.pathname+window.location.search+'#hr');
          S.publicView='admin';renderHeader();await renderAdmin();
        }
      }catch(error){showError(error)}
    },true);

    /* Internal directories use capture handlers so the legacy general click
       handler cannot process the same action twice. They fetch only the page

    document.addEventListener('click',async event=>{
      const el=event.target&&event.target.closest?event.target.closest('[data-action]'):null;
      const handled=['filter-apps','filter-job-applications','application-page','bulk-update-applications','filter-candidates','candidate-page','candidate-detail','filter-clients','open-client-form','edit-client','sync-screening-job-sheet','filter-screening-job-sheets','update-job-company-cv-status'];
      if(!el||!handled.includes(el.dataset.action))return;
      event.preventDefault();event.stopImmediatePropagation();
      try{
        const a=el.dataset.action;
        if(a==='filter-apps'){
          const data=await api('getApplicationGroupsAdmin',{keyword:($('#admin-app-search')||{}).value||'',status:($('#admin-app-status')||{}).value||'',location:($('#admin-app-location')||{}).value||'',minScore:($('#admin-app-score')||{}).value||'',dateFrom:($('#admin-app-from')||{}).value||'',dateTo:($('#admin-app-to')||{}).value||''},S.admin.token);
          $('#admin-main').innerHTML=applicationsView(data);
        }else if(a==='filter-job-applications'){
          await openJobApplications(el.dataset.id,1,{keyword:($('#job-app-search')||{}).value||'',status:($('#job-app-status')||{}).value||'',dateFrom:($('#job-app-from')||{}).value||'',dateTo:($('#job-app-to')||{}).value||''});
        }else if(a==='application-page'){
          const page=Number(el.dataset.page)||1;
          if(page>0)await openJobApplications(el.dataset.id,page,S.jobApplicationFilters||{});
        }else if(a==='bulk-update-applications'){
          const ids=Array.from(document.querySelectorAll('#admin-main input[name="app-select"]:checked')).map(input=>input.value);
          const status=(($('#bulk-app-status')||{}).value||'').trim();
          if(!ids.length){toast('Hãy chọn ít nhất một CV.','error');return}
          if(!status){toast('Hãy chọn trạng thái cần cập nhật.','error');return}
          el.disabled=true;el.textContent='Đang cập nhật…';
          const result=await api('bulkUpdateApplicationStatus',ids,status,{InterviewDate:(($('#bulk-interview-date')||{}).value||'')},S.admin.token);
          await openJobApplications(el.dataset.id,S.currentJobAppsPage||1,S.jobApplicationFilters||{});
          const mailFailed=Number(result&&result.emailDelivery&&result.emailDelivery.failed)||0;
          const queued=Boolean(result&&result.emailDelivery&&result.emailDelivery.queued);
          toast(mailFailed?'Đã cập nhật hồ sơ, nhưng email chưa gửi được. Kiểm tra Email & template để xem lỗi Gmail.':('Đã cập nhật '+(Number(result.count)||ids.length)+' hồ sơ. '+(queued?'Email đang chờ gửi nền.':'Email cập nhật đã được gửi.')),mailFailed?'error':'success');
        }else if(a==='sync-screening-job-sheet'){
          await syncScreeningJobSheetFromPortal(el.dataset.id,el);
        }else if(a==='filter-screening-job-sheets'){
          await openScreeningResponses(el.dataset.clear==='true'?{}:screeningJobSheetFiltersFromPage());
        }else if(a==='update-job-company-cv-status'){
          const picker=Array.from(document.querySelectorAll('[data-job-cv-status]')).find(input=>input.dataset.jobCvStatus===String(el.dataset.id||''));
          if(!picker){toast('Không tìm thấy trạng thái cần lưu.','error');return}
          el.disabled=true;el.textContent='Đang lưu…';
          const result=await api('updateJobCompanyCvSendStatus',el.dataset.id,picker.value,S.admin.token);
          await openScreeningResponses(S.screeningJobFilters||{});
          toast(result.label?'Đã lưu: '+result.label:'Đã lưu trạng thái gửi CV.','success');
        }else if(a==='filter-candidates'){
          await openCandidates(1,(($('#candidate-search')||{}).value||''));
        }else if(a==='candidate-page'){
          const page=Number(el.dataset.page)||1;
          if(page>0)await openCandidates(page,S.candidateAdminKeyword||'');
        }else if(a==='candidate-detail'){
          await openCandidateDetail(el.dataset.id);
        }else if(a==='filter-clients'){
          const data=await api('getClientsAdmin',{keyword:($('#client-search')||{}).value||''},S.admin.token);
          $('#admin-main').innerHTML=clientsView(data);
        }else if(a==='open-client-form'){
          await openClientForm();
        }else{
          await openClientForm(el.dataset.id);
        }
      }catch(error){showError(error)}finally{if(el.dataset.action==='bulk-update-applications'){el.disabled=false;el.textContent='Cập nhật đã chọn'}if(el.dataset.action==='update-job-company-cv-status'){el.disabled=false;el.textContent='Lưu trạng thái'}}
    },true);
    document.addEventListener('submit',async event=>{
      const form=event.target;
      if(!form||form.id!=='application-status-form')return;
      event.preventDefault();event.stopImmediatePropagation();
      const button=$('button[type="submit"]',form);
      try{
        if(button){button.disabled=true;button.textContent='Đang cập nhật…'}
        const data=Object.fromEntries(new FormData(form).entries());
        const result=await api('updateApplicationStatus',form.dataset.id,data.status,data,S.admin.token);
        closeModal();
        const listStillOpen=$('#admin-main .cv-select-list');
        if(listStillOpen&&S.currentAdminJob&&S.currentAdminJob.JobID){
          await openJobApplications(S.currentAdminJob.JobID,S.currentJobAppsPage||1,S.jobApplicationFilters||{});
        }else if(S.adminView==='dashboard'){
          S.dashboard=null;await renderAdmin();
        }else{
          await renderAdminView();
        }
        const mailFailed=Number(result&&result.emailDelivery&&result.emailDelivery.failed)||0;
        const queued=Boolean(result&&result.emailDelivery&&result.emailDelivery.queued);
        const busy=Boolean(result&&result.emailDelivery&&result.emailDelivery.skipped);

      }catch(error){showError(error)}finally{if(button){button.disabled=false;button.textContent='Lưu & gửi email theo trạng thái'}}
    },true);
    document.addEventListener('submit',async event=>{

    /* Final screening editor: every question is free-form, while HR may choose

        await openScreeningResponses();
        toast('Đã đồng bộ Sheet gốc.','success');
      }catch(error){showError(error)}finally{if(button){button.disabled=false;button.textContent=original||'Đồng bộ dữ liệu'}}
    }
    init();
  </script>
</body>
